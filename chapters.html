<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal - Bab</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="reader-body">
    <div class="nav-bar" style="display: flex; gap: 10px; justify-content: flex-end;">
        <a href="editor.html" id="newJournalBtn" class="logout-btn" style="text-decoration: none; background: rgba(255, 255, 255, 0.2);">+ Tulis Baru</a>
        <button id="logoutBtn" class="logout-btn">Kunci Kembali</button>
    </div>
    <div class="layout-container">
        <!-- Sidebar Daftar Isi -->
        <aside class="sidebar glass-card" id="sidebar">
            <div class="sidebar-header">
                <h3>Daftar Isi</h3>
                <button id="toggleSidebarBtn" class="mobile-only">✕</button>
            </div>
            <div class="chapter-list" id="chapter-list">
                <p class="loading">Memuat daftar bab...</p>
            </div>
        </aside>

        <!-- Area Konten Utama -->
        <main class="main-content">
            <button id="openSidebarBtn" class="mobile-only glass-card">☰ Daftar Bab</button>
            <div class="reader-container glass-card" id="content-area">
                <p class="loading">Memilih bab...</p>
            </div>
            
            <!-- Tombol Navigasi Bab -->
            <div class="chapter-navigation" id="chapter-navigation" style="display: none;">
                <button id="prevChapterBtn" class="nav-chapter-btn">← Sebelumnya</button>
                <button id="nextChapterBtn" class="nav-chapter-btn">Selanjutnya →</button>
            </div>
        </main>
    </div>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
